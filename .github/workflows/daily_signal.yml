name: Daily Stock Signal

on:
  schedule:
    - cron: '0 0 * * 1-5'  # 平日 09:00 JST（UTC 00:00）
  workflow_dispatch:         # 手動実行ボタンも有効

jobs:
  signal:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal agent & notify LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py --notify-line --dry-run

      - name: Weekly backtest & notify LINE (Monday only)
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          [ "$(date +%u)" = "1" ] && python main.py --backtest --notify-line || true
